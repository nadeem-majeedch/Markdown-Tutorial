name: Deploy documentation to GitHub Pages

# Publishes the MkDocs site (built from the tutorial Markdown at the repo
# root) to GitHub Pages using the official artifact-based deployment actions.
# No gh-pages branch is created or used.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a queued run for an older commit is
# cancelled as soon as a newer one arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Install documentation tooling
        run: python -m pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build the site with MkDocs
        run: |
          python scripts/prepare_docs.py
          mkdocs build --clean --site-dir site

      # Clear failure if the build silently produced an empty/invalid site.
      - name: Verify the build output exists
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::MkDocs build did not produce site/index.html"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
